name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 单元测试（含食物库 4/9/4 自洽校验）
        run: npm test

      - name: 类型检查与构建
        run: npm run build
